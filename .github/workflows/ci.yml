name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vitest 5 requires Node >= 22.12.0
          node-version: "22.12"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (production high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (full tree high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
